name: 'Release & Production Build'

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Runner: Builds standalone .exe, NSIS installer (.exe), and WiX (.msi)
          - platform: 'windows-latest'
            name: 'Windows x86_64 (.exe & .msi)'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
            artifact_name: 'OmniJXL-Windows-x64'

          # macOS Runner: Native Apple Silicon VM building Universal Binary (M1/M2/M3/M4 & Intel) .dmg
          - platform: 'macos-latest'
            name: 'macOS Universal (Apple Silicon & Intel)'
            target: 'universal-apple-darwin'
            args: '--target universal-apple-darwin'
            artifact_name: 'OmniJXL-macOS-Universal'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # For universal-apple-darwin, install both aarch64 (Apple Silicon) and x86_64 (Intel) targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install macOS Dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install jpeg-xl || true

      - name: Install Windows Dependencies
        if: matrix.platform == 'windows-latest'
        run: |
          choco install wixtoolset -y || true

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build SvelteKit Frontend
        run: npm run build

      - name: Run Backend Unit & Security Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Configure Signing Environment
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build & Package with Official Tauri Action
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OmniJXL v__VERSION__"
          releaseBody: |
            ## OmniJXL v__VERSION__ Production Release

            High-performance, bidirectional JPEG XL conversion engine with full ComfyUI workflow preservation and defensive memory limits.

            ### Included Installers & Binaries:
            - **Windows (x86_64)**:
              - `OmniJXL_*_x64-setup.exe` (NSIS Installer)
              - `OmniJXL_*_x64_en-US.msi` (Windows MSI Installer)
              - `OmniJXL_standalone_x64.exe` (Standalone Portable Executable)
            - **macOS Universal (Apple Silicon M1/M2/M3/M4 & Intel)**:
              - `OmniJXL_*_universal.dmg` (Drag-and-Drop Disk Image)
              - `OmniJXL_*_universal.app.tar.gz` (macOS Application Bundle)
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Prepare Windows Standalone Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/omnijxl.exe") {
            Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/omnijxl.exe" "OmniJXL_standalone_x64.exe"
            Write-Host "Created OmniJXL_standalone_x64.exe from target/x86_64-pc-windows-msvc/release"
          } elseif (Test-Path "src-tauri/target/release/omnijxl.exe") {
            Copy-Item "src-tauri/target/release/omnijxl.exe" "OmniJXL_standalone_x64.exe"
            Write-Host "Created OmniJXL_standalone_x64.exe from target/release"
          }

      - name: Attach Standalone Executable to GitHub Release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "OmniJXL_standalone_x64.exe" ]; then
            gh release upload "${{ github.ref_name }}" OmniJXL_standalone_x64.exe --clobber || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            OmniJXL_standalone_x64.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
          if-no-files-found: warn
