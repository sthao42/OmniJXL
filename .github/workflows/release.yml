name: 'Release & Production Build'

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Runner: Builds standalone .exe, NSIS installer (.exe), and WiX (.msi)
          - platform: 'windows-latest'
            name: 'Windows x86_64 (.exe & .msi)'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
            artifact_name: 'OmniJXL-Windows-x64'

          # Linux Runner: Builds Debian .deb and universal .AppImage on Ubuntu 26.04
          - platform: 'ubuntu-26.04'
            name: 'Linux Ubuntu 26 x86_64 (.deb & .AppImage)'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
            artifact_name: 'OmniJXL-Linux-Ubuntu26-x64'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Windows Dependencies
        if: matrix.platform == 'windows-latest'
        run: |
          choco install wixtoolset -y || true

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build SvelteKit Frontend
        run: npm run build

      - name: Run Backend Unit & Security Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Configure Signing Environment
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Build & Package with Official Tauri Action
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OmniJXL v__VERSION__"
          releaseBody: |
            ## OmniJXL v__VERSION__ Production Release

            High-performance, bidirectional JPEG XL conversion engine with full ComfyUI workflow preservation and defensive memory limits.

            ### Included Installers & Binaries:
            - **Windows (x86_64)**:
              - `OmniJXL_*_x64-setup.exe` (NSIS Installer)
              - `OmniJXL_*_x64_en-US.msi` (Windows MSI Installer)
              - `OmniJXL_standalone_x64.exe` (Standalone Portable Executable)
            - **Linux (Ubuntu 26.04+ / Debian x86_64)**:
              - `omnijxl_*_amd64.deb` (Debian Package)
              - `omnijxl_*_amd64.AppImage` (Universal Linux AppImage)
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.args }}

      - name: Prepare Windows Standalone Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/omnijxl.exe") {
            Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/omnijxl.exe" "OmniJXL_standalone_x64.exe"
            Write-Host "Created OmniJXL_standalone_x64.exe from target/x86_64-pc-windows-msvc/release"
          } elseif (Test-Path "src-tauri/target/release/omnijxl.exe") {
            Copy-Item "src-tauri/target/release/omnijxl.exe" "OmniJXL_standalone_x64.exe"
            Write-Host "Created OmniJXL_standalone_x64.exe from target/release"
          }

      - name: Attach Standalone Executable to GitHub Release
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "OmniJXL_standalone_x64.exe" ]; then
            gh release upload "${{ github.ref_name }}" OmniJXL_standalone_x64.exe --clobber || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            OmniJXL_standalone_x64.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: warn
